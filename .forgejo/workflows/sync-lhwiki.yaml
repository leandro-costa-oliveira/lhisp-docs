name: Sincronizar branch lhwiki

# Publica o conteúdo de `main` no branch `lhwiki` (consumido pelo Wiki.js),
# removendo arquivos que não devem virar páginas da wiki.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm
    steps:
      - name: Sincronizar main -> lhwiki
        env:
          LHWIKI_TOKEN: ${{ secrets.LHWIKI_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq git
          fi

          if [ -z "${LHWIKI_TOKEN}" ]; then
            echo "Secret LHWIKI_TOKEN não configurado." >&2
            exit 1
          fi

          host="${SERVER_URL#https://}"
          host="${host#http://}"
          remote="https://x-access-token:${LHWIKI_TOKEN}@${host}/${REPOSITORY}.git"

          git clone --quiet "${remote}" work
          cd work
          git config user.name "Forgejo Actions"
          git config user.email "actions@lhprovedor.com.br"

          # Reaproveita o histórico de lhwiki se ele já existir
          if git ls-remote --exit-code --heads origin lhwiki >/dev/null 2>&1; then
            git checkout --quiet -B lhwiki origin/lhwiki
          else
            git checkout --quiet --orphan lhwiki
          fi

          # Esvazia a árvore de trabalho e recria a partir de main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git checkout "${SOURCE_SHA}" -- .

          # Arquivos que não devem ir para a wiki
          rm -rf CLAUDE.md README.md planos

          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar em lhwiki."
            exit 0
          fi

          git commit --quiet -m "sync: main@${SOURCE_SHA} -> lhwiki"
          git push --quiet origin lhwiki
          echo "lhwiki atualizado a partir de main@${SOURCE_SHA}."
